name: feed-mirror

# Зеркало данных для сайта: снимок API totobrief + разбор stavka.tv → data/api/*.json
# Запускается каждые полчаса и вручную (кнопка «Run workflow» во вкладке Actions).

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Снять данные
        run: python3 scripts/feed.py

      - name: Закоммитить, если что-то изменилось
        run: |
          git config user.name "feed-mirror"
          git config user.email "feed-mirror@users.noreply.github.com"
          git add -A data/api
          if git diff --cached --quiet; then
            echo "изменений нет"
            exit 0
          fi
          git commit -m "feed: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
