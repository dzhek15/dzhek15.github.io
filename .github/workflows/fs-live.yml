name: fs-live

# Снимок идущих матчей Flashscore → ветка live, data/api/fs-1.txt и fs-4.txt.
# Запасной путь для сайта, если Cloudflare Worker у посетителя не открывается (например, без VPN).
# Запускается каждые 5 минут и вручную.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fs-live
  cancel-in-progress: true

jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: live
          path: live-wt
          fetch-depth: 1

      - name: Снять живые матчи
        run: FSLIVE_OUT="$PWD/live-wt/data/api" python3 scripts/fslive.py

      - name: Записать в ветку live, если что-то изменилось
        run: |
          cd live-wt
          git config user.name "feed-mirror"
          git config user.email "feed-mirror@users.noreply.github.com"
          git add -A data/api
          if git diff --cached --quiet; then
            echo "изменений нет"
            exit 0
          fi
          git commit -q --amend -m "live: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -q -f origin HEAD:live
