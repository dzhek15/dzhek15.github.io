name: Разбор тиража

on:
  schedule:
    # 06:00 и 15:00 по Москве (в UTC на три часа раньше)
    - cron: "0 3,12 * * *"
  workflow_dispatch:        # кнопка «Run workflow» для запуска руками

permissions:
  contents: write           # нужно, чтобы коммитить preset.json обратно в репозиторий

concurrency:
  group: analyze
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Считаю серии и форму
        run: node scripts/analyze.mjs

      - name: Кладу preset.json в репозиторий
        run: |
          if git diff --quiet -- preset.json; then
            echo "preset.json не изменился — коммитить нечего"
            exit 0
          fi
          git config user.name  "tototik-bot"
          git config user.email "bot@users.noreply.github.com"
          git add preset.json
          git commit -m "разбор тиража: обновил preset.json"
          git push
