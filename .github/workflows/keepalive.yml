name: keepalive

# Страховка от пропусков расписания GitHub: одно долгое задание само снимает данные
# (живые матчи — каждую минуту, коммит только при изменении; зеркало totobrief/stavka и эмблемы — каждые 30 минут),
# а в конце запускает себя заново. Расписание ниже только поднимает цепочку, если она оборвалась.
# Снимки Flashscore (fs-*.txt) пишутся в отдельную ветку live, чтобы коммиты каждую минуту не отменяли сборки Pages.
# Обычные feed-mirror и fs-live остаются как есть.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Цикл снятия данных
        run: |
          git config user.name "feed-mirror"
          git config user.email "feed-mirror@users.noreply.github.com"
          B="${GITHUB_REF_NAME}"
          sync() { git fetch -q origin "$B" && git reset -q --hard "origin/$B"; }
          # ветка live: один коммит, перезаписывается (amend + force), история не растёт
          echo "live-wt/" >> .git/info/exclude
          git fetch -q origin live
          git worktree add -q -f --detach live-wt origin/live
          export FSLIVE_OUT="$PWD/live-wt/data/api"
          sync_live() { git -C live-wt fetch -q origin live && git -C live-wt reset -q --hard origin/live; }
          push_live() {
            git -C live-wt add -A data/api
            if ! git -C live-wt diff --cached --quiet; then
              git -C live-wt commit -q --amend -m "live: $(date -u +'%Y-%m-%d %H:%M UTC')"
              git -C live-wt push -q -f origin HEAD:live || true
            fi
          }
          end=$(( $(date +%s) + 335*60 ))
          n=0
          while [ "$(date +%s)" -lt "$end" ]; do
            t0=$(date +%s)
            sync || true
            sync_live || true
            kind="fs-live"
            if [ $((n % 5)) -eq 0 ]; then
              # раз в 5 минут: полный снимок (с файлами тиража), время снимка обновляется всегда
              FSLIVE_FORCE=1 python3 scripts/fslive.py || true
              if [ $((n % 30)) -eq 0 ]; then
                kind="feed"
                python3 scripts/feed.py || true
                python3 scripts/emblems.py || true
                python3 scripts/journal.py || true
              fi
            else
              # остальные минуты: только живые матчи, коммит лишь если что-то изменилось (гол, фаза, новый матч)
              FSLIVE_FAST=1 python3 scripts/fslive.py || true
            fi
            push_live
            git add -A data/api icons/teams
            if ! git diff --cached --quiet; then
              git commit -q -m "$kind: $(date -u +'%Y-%m-%d %H:%M UTC') (keepalive)"
              for i in 1 2 3; do
                git pull -q --rebase origin "$B" && git push -q && break
                git rebase --abort 2>/dev/null || true
                sleep 3
              done
              # не вышло — откат к удалённому состоянию, данные снимутся заново на следующем круге
              git fetch -q origin "$B" && git status -sb | head -1 | grep -q "ahead" && git reset -q --hard "origin/$B" || true
            fi
            n=$((n+1))
            d=$(( 60 - ($(date +%s) - t0) )); [ "$d" -gt 5 ] && sleep "$d" || sleep 5
          done

      - name: Запустить цепочку заново
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run keepalive.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
